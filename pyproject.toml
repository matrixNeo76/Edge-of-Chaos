[build-system]
# The native module (lib.rs) is built with maturin; maturin reads this file.
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
# Single source of the Python dependencies. requirements.txt / requirements-dev.txt keep the same
# ranges for pip users (install.sh, install.ps1, Dockerfile); tools/tests/test_dependency_sync.py
# fails if the two drift apart. The wheel built by maturin is the native module only.
name = "thermodynamic_valence"
dynamic = ["version"]  # from Cargo.toml
description = "Digital twin and metrology for the research programme on primary interoceptive sentience"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
authors = [{ name = "Francesco Iavarone" }]
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
    "matplotlib>=3.7,<4",
    "seaborn>=0.12,<1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.15,<0.17",
    "hypothesis>=6",
    "mypy>=1.10",
]
build = [
    "maturin>=1.5,<2",
    "pyinstaller>=6.0,<7",
]

[tool.uv]
# uv manages the environment and the lockfile only; the native module is built separately with
# maturin, so `uv sync` never needs a Rust toolchain.
package = false

[tool.maturin]
module-name = "thermodynamic_valence_rust"

[tool.pytest.ini_options]
# One test command everywhere: `python -m pytest -q` finds the code tests (test_*.py in the root)
# and the tests of tools/. The private folders and build outputs are never collected.
testpaths = [".", "tools/tests"]
python_files = ["test_*.py"]
norecursedirs = [".*", "docs", "docs_v0.2", "media", "notebooks", "output", "target", "build", "dist",
                 "dist_wheel", "venv", "venv_build", "__pycache__"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["venv", "venv_build", "build", "dist", "target", "docs", "docs_v0.2", "notebooks"]

[tool.ruff.lint]
# Explicit rule set, so that a new ruff version with different defaults gives the same result.
# E/F: errors; B: likely bugs; UP: modern syntax for the supported Python; I: import order;
# NPY: NumPy deprecations (NumPy 2); PT: pytest style.
select = ["E4", "E7", "E9", "F", "B", "UP", "I", "NPY", "PT"]
# The test classes are unittest.TestCase (they also run under unittest), so their assertion
# methods stay: converting ~220 of them to bare asserts would add churn and no checking power.
ignore = ["PT009", "PT027"]

[tool.mypy]
# Types are checked on tools/ (it handles published files and metadata); the scientific modules
# are not annotated yet.
files = ["tools"]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
