[package]
name = "thermodynamic_valence"
version = "0.4.0"
edition = "2021"
authors = ["Lakatosian Research Programme"]
description = "Metrology and Digital Twin module for neuromorphic substrates and thermodynamic valence (P0_Distilled v0.1)"
license = "MIT OR Apache-2.0"

[dependencies]
# Note: the thermodynamic_valence.rs binary is designed to be zero-dependencies
# (std-only), for maximum execution speed and cross-platform build simplicity.
# pyo3 is only required by the lib.rs library target (Python extension).
pyo3 = { version = "0.20", features = ["extension-module"] }

[lib]
name = "thermodynamic_valence_rust"
crate-type = ["cdylib"]
path = "lib.rs"

[[bin]]
name = "thermodynamic_valence"
path = "thermodynamic_valence.rs"
