[package]
name = "valenza_metrologia"
version = "0.1.0"
edition = "2021"
authors = ["Programma di Ricerca Lakatosiano"]
description = "Modulo di Metrologia e Digital Twin per Substrati Neuromorfici e Valenza Termodinamica (P0_Distilled v0.1)"
license = "MIT OR Apache-2.0"

[dependencies]
# Nota: il binario valenza_metrologia.rs e' progettato per essere zero-dependencies (std-only)
# per garantire la massima velocita' di esecuzione e facilità di compilazione cross-platform.
# pyo3 e' richiesto solo dal target di libreria lib.rs (estensione Python).
pyo3 = { version = "0.20", features = ["extension-module"] }

[lib]
name = "valenza_metrologia_rust"
crate-type = ["cdylib"]
path = "lib.rs"

[[bin]]
name = "valenza_metrologia"
path = "valenza_metrologia.rs"
