key = "sanzperl2021"
identifier = "arxiv:2012.10792"
fields = ["year"]
reason = "The arXiv preprint is from 2020; the entry cites the journal version, Physical Review E 104, 014411, published July 2021 (checked on Crossref, round 4)."

