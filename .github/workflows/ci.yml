name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run, to catch breakage from new versions of dependencies and actions
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov ruff==0.15.12
      - name: Lint
        run: ruff check .
      - name: Release version is consistent
        run: python -m tools.check_versions
      - name: Tests of the corpus and repository tools
        run: python -m pytest -q tools/tests
      - name: Run tests with coverage
        env:
          MPLBACKEND: Agg
        run: >
          python -m pytest -q
          --cov=thermodynamic_valence --cov=demarcation --cov=necessary_conditions
          --cov=hardware_driver_v2 --cov=synthetic_systems --cov-report=term-missing
          test_thermodynamic_valence.py test_hardware_session.py
          test_demarcation.py test_necessary_conditions.py
      - name: Command-line demonstrations
        env:
          MPLBACKEND: Agg
          OUTPUT_DIR: ci_output
        run: |
          python paper0_cli.py metrology
          python paper0_cli.py conditions
          python paper0_cli.py dashboard

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust unit tests
        run: cargo test --release --locked
      - name: Build binary and PyO3 library
        run: cargo build --release --locked
      - name: Run binary
        run: ./target/release/thermodynamic_valence
      - name: Python/Rust parity (native module built with maturin)
        run: |
          pip install -r requirements.txt pytest maturin
          maturin build --release --out dist_wheel
          pip install dist_wheel/*.whl
          # The parity test skips itself without the native module; here it must run.
          python -c "import thermodynamic_valence_rust as m; assert hasattr(m, 'calculate_valence_with_niche_rust')"
          python -m pytest -q -rs test_engine_parity.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image (runs the test suites at build time)
        run: docker build -t edge-of-chaos:ci .
      - name: docker compose configuration
        run: docker compose config --quiet
