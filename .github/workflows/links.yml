name: Links

# Broken URLs and DOIs in the public documents (README files, citation metadata, guides).
# Weekly and on demand only: external sites fail transiently, and a pull request should not
# turn red because a server is slow.
on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --max-retries 3 --retry-wait-time 10
            --accept 200,206,429
            --exclude-path docs --exclude-path docs_v0.2 --exclude-path media
            './*.md' 'CITATION.cff' '.zenodo.json' 'tools/*.md'
          fail: true
