# Weekly update proposals, as pull requests that go through CI and review like any other.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    # Widen the declared range to include a new release instead of raising the minimum
    # version, which could drop support (e.g. NumPy 2.5 requires Python 3.12).
    versioning-strategy: widen
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
