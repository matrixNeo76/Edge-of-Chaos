# Lint configuration (run in CI). Default rule set; the virtual environments and
# build outputs are excluded.
target-version = "py311"
line-length = 120

[lint]
# Explicit rule set, so that newer ruff versions with different defaults give the same result
select = ["E4", "E7", "E9", "F"]
extend-exclude = ["venv", "venv_build", "build", "dist", "target", "docs", "docs_v0.2", "notebooks"]
